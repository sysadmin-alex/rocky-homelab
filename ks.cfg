text --non-interactive
lang en_US.UTF-8
keyboard --xlayouts='us'
timezone Europe/Athens --utc
timesource --ntp-server=2.rocky.pool.ntp.org
rootpw --lock
user --name=sysadmin --iscrypted --password=$6$2jRsYzrMvjcjIQk2$MzIFvt7ex1K5AzbM95LsXraN0r3lD0BPORD73s6PKCjvCAIfRGHc6EkzrhrE1WsnSQR8JSfOaiLS/scaIxDTg1 --groups=wheel
url --url="https://dl.rockylinux.org/pub/rocky/10.2/BaseOS/x86_64/os/"
repo --name="AppStream" --baseurl="https://dl.rockylinux.org/pub/rocky/10.2/AppStream/x86_64/os/"
zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --nolvm --type=partition --fstype=xfs --nohome
bootloader --location=mbr --append="crashkernel=2G-32G:256M,32G-64G:374M,64G-:512M console=tty0"
network --device=link --hostname=rocky99 --bootproto=dhcp --nameserver=1.1.1.1 --onboot=yes --activate
skipx
firstboot --disable
sshkey --username=sysadmin "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGq59B5SqoAaBdY2EW2yHxGBv8O0jWH5lUQOggozmIH1 student@rocky2"
selinux --enforcing
firewall --enabled --ssh
services --enabled=sshd,chronyd,auditd,NetworkManager,rsyslog

%packages
@^server-product-environment
audit
rsyslog
bash-completion
open-vm-tools
%end

%post --log=/root/kickstart-handover.log
set -euo pipefail
curl -fsSL --retry 5 -o /usr/local/sbin/setup.sh \
  "https://raw.githubusercontent.com/sysadmin-alex/rocky-homelab/refs/heads/main/setup.sh"
chmod 700 /usr/local/sbin/setup.sh
cat << 'EOF' > /etc/systemd/system/firstboot.service
[Unit]
Description=First boot setup
After=network-online.target firewalld.service
Wants=network-online.target
ConditionPathExists=!/var/lib/firstboot.done

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/setup.sh
ExecStartPost=/usr/bin/touch /var/lib/firstboot.done
StandardOutput=append:/var/log/firstboot_script.log
StandardError=append:/var/log/firstboot_script.log

[Install]
WantedBy=multi-user.target
EOF

systemctl enable firstboot.service
restorecon -v /usr/local/sbin/setup.sh /etc/systemd/system/firstboot.service || true
%end

reboot --eject
