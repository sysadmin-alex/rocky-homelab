text --non-interactive
lang en_US.UTF-8
keyboard --xlayouts='us'
timezone Europe/Athens --ntpservers=0.gr.pool.ntp.org,1.gr.pool.ntp.org
rootpw --lock
user --name=sysadmin --iscrypted --password=$6$XFitpu3B71QQT9Cw$wA3aILzyYjFnZ/v/hp8ltWVLVJYxx98C7Q67ZTasIRuX2oOPSuHCA4AdwCTTck/sQK5Ym6pKRWwmJqeCaCYpS0 --groups=wheel
url --url="https://dl.rockylinux.org/pub/rocky/10.2/BaseOS/x86_64/os/"
repo --name="AppStream" --baseurl="https://dl.rockylinux.org/pub/rocky/10.2/AppStream/x86_64/os/"
zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --nolvm --type=partition --fstype=xfs --nohome
bootloader --location=mbr --append="crashkernel=2G-32G:256M,32G-64G:374M,64G-:512M console=tty0"
network --device=link --hostname=rocky3 --bootproto=dhcp --nameserver=1.1.1.1 --onboot=yes --activate
skipx
firstboot --disable

selinux --enforcing
firewall --enabled --ssh
services --enabled=sshd,chronyd,auditd,NetworkManager,rsyslog

%packages
@^server-product-environment
httpd
bash-completion
open-vm-tools
git
ansible-core
%end

%post --log=/root/kickstart-handover.log
dnf install epel-release -y || true
SCRIPT_URL="https://raw.githubusercontent.com/sysadmin-alex/rocky-homelab/refs/heads/main/setup.sh"
SCRIPT_PATH="/root/setup.sh"
curl -sSL $SCRIPT_URL -o $SCRIPT_PATH
chmod +x $SCRIPT_PATH
cat << 'EOF' > /etc/systemd/system/firstboot.service
[Unit]
Description=First Boot on Rocky Production Script
After=network-online.target
Wants=network-online.target

[Service]
Type=oneshot
ExecStart=/bin/bash -c "/root/setup.sh >> /var/log/firstboot_script.log 2>&1"
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
EOF

systemctl enable firstboot.service
%end

reboot --eject
